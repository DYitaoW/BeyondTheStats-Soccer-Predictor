name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "Beyond-the-Stats/Website/**"
      - "Beyond-the-Stats/scripts/build_static_frontend.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Beyond-the-Stats/requirements.txt

      - name: Install dependencies
        working-directory: Beyond-the-Stats
        run: pip install -r requirements.txt

      - name: Build static frontend
        working-directory: Beyond-the-Stats
        run: |
          python scripts/build_static_frontend.py \
            --api-base "https://api.beyondthestatsapp.com" \
            --out public --clean

      - name: Verify static build output
        working-directory: Beyond-the-Stats
        run: |
          test -f public/index.html
          test -f public/privacy/index.html
          test -f public/terms/index.html
          test -f public/subscriptions/index.html
          test -f public/draftit/about/index.html
          test -f public/draftit/privacy/index.html
          test -f public/upcoming-matches.html
          test -f public/static/shared.js
          test -f public/_redirects
          ! test -f public/world-cup.html
          ! grep -q 'loadHomeWorldCup\|wc-winner-odds\|World Cup 2026' public/index.html public/static/home.js
          ! grep -Eq '["'"'"'`]\/api\/home\/' public/static/home.js public/static/shared.js
          grep -q '/api/upcoming/' public/static/home.js
          grep -q 'api.beyondthestatsapp.com' public/static/shared.js
          grep -q 'Draft It!' public/draftit/about/index.html public/draftit/privacy/index.html
          node --check public/static/shared.js
          node --check public/static/home.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Beyond-the-Stats
          command: pages deploy public --project-name=beyond-the-stats
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
