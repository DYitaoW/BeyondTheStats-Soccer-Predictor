name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "Beyond-the-Stats/Website/**"
      - "Beyond-the-Stats/scripts/build_static_frontend.py"
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Beyond-the-Stats
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Beyond-the-Stats/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static frontend
        run: |
          python scripts/build_static_frontend.py \
            --api-base "https://api.beyondthestatsapp.com" \
            --out public --clean

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=beyond-the-stats
